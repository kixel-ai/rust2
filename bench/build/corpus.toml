# What `just bench` builds and how. Changing a rev or args is a corpus
# bump: land it on its own so numbers on either side of it are not compared.

# `args` selects what each scenario builds. `leaf` and `hub` are the crate roots
# the incremental scenarios edit: a crate nothing in the build depends on, and
# one most of the build depends on. `sync` and `async` are the body edits: a file
# and the line in it that opens the body of a sync or async function the build
# calls; a corpus without one skips its scenario. `no-c` allows pure-Rust
# build scripts but fails on native links and on the cc and cmake crates. `test` is what the test scenarios pass to `cargo nextest run`; a corpus
# without it skips them.

[[corpus]]
name = "moq"
git = "https://github.com/moq-dev/moq"
rev = "142b03bd5c8360444750872223b03db04b106978"
args = ["-p", "moq-relay"]
leaf = "rs/moq-relay/src/lib.rs"
hub = "rs/moq-net/src/lib.rs"
no-c = true
# What moq-relay calls to drain a session at shutdown, and awaits to see it close:
# a wrapper over `poll_closed`, as moq writes an async fn.
sync = ["rs/moq-net/src/goaway.rs", "pub fn send(self, goaway: Goaway) -> Result<()> {"]
async = ["rs/moq-net/src/session.rs", "pub async fn closed(&self) -> Error {"]
# The tests of every workspace crate moq-relay builds, under the profile moq's CI
# uses. Not moq-auth's or moq-pattern's: moq-auth's tests depend on its published
# self, which brings a published moq-pattern, and both share their workspace
# twin's version, so no package spec names either alone. qmux's version picks the
# workspace crate over a published one.
test = [
    "--profile=ci",
    "--package=kio",
    "--package=kio-macros",
    "--package=moq-congestion",
    "--package=moq-crypto",
    "--package=moq-json",
    "--package=moq-net",
    "--package=moq-quic",
    "--package=moq-relay",
    "--package=moq-sock",
    "--package=moq-stats",
    "--package=moq-tokio",
    "--package=qmux@0.7.0",
]

# Each variant is one build configuration. `base` names the variant it is
# compared against; a variant without one is a base. `rustflags` replaces any
# host rustflags the corpus configures (none do today). `config` holds cargo
# `--config` values, and `subcommand` goes between cargo and `build` or `check`. `corpora` and `scenarios` limit a variant to those
# they list, which its base must run too. A variant without `scenarios` runs
# `check`, `build`, `edit-leaf`, and `edit-hub`; only the levers worth their cost
# list the body edits and the test scenarios.

[[variant]]
name = "baseline"
toolchain = "stable"

[[variant]]
name = "mold"
base = "baseline"
toolchain = "stable"
rustflags = "-C link-arg=-fuse-ld=mold"

[[variant]]
name = "wild"
base = "baseline"
toolchain = "stable"
rustflags = "-C link-arg=-fuse-ld=wild"

# A/A control: identical to its base, so its delta is the run's noise.
[[variant]]
name = "control"
base = "baseline"
toolchain = "stable"

[[variant]]
name = "nightly"
toolchain = "nightly"
scenarios = ["check", "build", "edit-leaf", "edit-hub", "test-build", "test-run", "test-edit"]

[[variant]]
name = "jobs-frontend"
base = "nightly"
toolchain = "nightly"
rustflags = "-Z unstable-options --jobs-frontend=8"

# rind, moq's crypto, builds with LLVM: its naked_asm! takes sym operands, which
# Cranelift cannot compile yet (rust-lang/rustc_codegen_cranelift#1620). A profile
# picks the backend, since cargo passes RUSTFLAGS after a package's own flags.
[[variant]]
name = "cranelift"
base = "nightly"
toolchain = "nightly"
config = ["unstable.codegen-backend=true", 'profile.dev.codegen-backend="cranelift"', 'profile.dev.package.rind.codegen-backend="llvm"']
scenarios = ["check", "build", "edit-leaf", "edit-hub", "test-build", "test-run", "test-edit"]

[[variant]]
name = "cache-proc-macros"
base = "nightly"
toolchain = "nightly"
rustflags = "-Z cache-proc-macros"

[[variant]]
name = "nightly-control"
base = "nightly"
toolchain = "nightly"

# ra-jit keeps the workspace loaded in a daemon on rust-analyzer, and after an edit
# compiles only the changed functions with Cranelift and splices them into the
# program cargo linked, handing the build to cargo when it cannot. It works with
# one rustc only, so its base is plain cargo on that toolchain. It loads a program,
# and on a library corpus `cargo ra-jit build` returns without building anything.
# Neither checks: with no build loaded, `cargo ra-jit check` reads every crate of
# the workspace, tests included, and on moq it takes minutes to report errors
# rustc does not.
[[variant]]
name = "ra-jit-baseline"
toolchain = "ra-jit"
corpora = ["moq"]
scenarios = ["build", "edit-leaf", "edit-hub", "edit-sync", "edit-async"]

[[variant]]
name = "ra-jit"
base = "ra-jit-baseline"
toolchain = "ra-jit"
subcommand = "ra-jit"
corpora = ["moq"]
scenarios = ["build", "edit-leaf", "edit-hub", "edit-sync", "edit-async"]
