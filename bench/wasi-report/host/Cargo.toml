[package]
name = "wb-host"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
wasmtime = { version = "51", default-features = false, features = ["runtime", "cranelift", "component-model", "component-model-async", "async", "std", "pooling-allocator"] }
wasmtime-wasi = { version = "51", features = ["p1", "p3"] }
tokio = { version = "1", features = ["rt", "macros"] }
wb = { path = "../lib" }

[profile.release]
debug = 1
