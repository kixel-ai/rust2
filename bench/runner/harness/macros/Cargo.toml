[package]
name = "rust2-bench-macros"
description = "The #[bench] attribute of rust2-bench-harness"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kixel-ai/rust2"
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.10", features = ["full"] }

[lints]
workspace = true
