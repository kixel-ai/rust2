[package]
name = "rust2-bench-harness"
description = "Benchmarks as plain functions marked #[bench], counted by rust2-bench under Valgrind"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kixel-ai/rust2"
# A git dependency until a consumer needs it published.
publish = false

[dependencies]
inventory = "0.3.25"
rust2-bench-macros = { path = "macros" }

[[bench]]
name = "fixture"
harness = false

[lints]
workspace = true
