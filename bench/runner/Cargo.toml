[package]
name = "rust2-bench"
description = "Count each benchmark's instructions under stock Valgrind, in parallel"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kixel-ai/rust2"
# Installed through the flake, or with `cargo install --git`.
publish = false

# Compiled by build.rs as a separate preloaded library, not through a `mod`.
[package.metadata.cargo-shear]
ignored-paths = ["preload.rs"]

[workspace]
# Its own workspace, apart from the repo's other projects, on the repository's stable toolchain,
# with the harness benchmarks are written with.
members = ["harness", "harness/macros"]
resolver = "3"

[workspace.lints.clippy]
# Every suppression says why, so the next lint audit can judge it.
allow_attributes_without_reason = "warn"

[dependencies]
# For its perf counters, which a perf count checks this host exposes before building anything.
rust2-bench-harness = { path = "harness" }
serde_json = "1.0.154"
toml = "1.1.8"

[lints]
workspace = true
