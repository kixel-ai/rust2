name: CI

# Every pull request into main gets build.yml's run of what its diff selects,
# so its author sees the queue's result before picking it; nothing requires
# it, since the queue builds each group again. A push to main runs it too,
# which is the only run that saves the build cache the others restore.
on:
  pull_request:
    branches: [main]
    # `edited` covers a PR retargeted to main; the job skips other edits.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

# No secrets, and a read-only token: a pull request runs its branch's own
# workflow edits.
permissions:
  contents: read

jobs:
  build:
    name: CI
    if: github.event.action != 'edited' || github.event.changes.base
    # A new push supersedes a pull request's run. Each push to main finishes,
    # since a later one may not select the modules whose cache it saves. On the
    # job, so a skipped title or body edit cancels nothing.
    concurrency:
      group: ci-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: true
    uses: ./.github/workflows/build.yml
    with:
      run: true
