name: CI

# build.yml's run of what each push to main selects. It is the only run that
# saves the build cache merge groups restore, so the queue builds warm. Pull
# requests run no CI: agents run `just ci` before pushing, and the merge queue
# builds each group.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Each push to main finishes, since a later one may not select the modules
  # whose cache it saves.
  build:
    name: CI
    uses: ./.github/workflows/build.yml
    with:
      run: true
