name: Binding packages

# The shared, read-only builder of a crate's rust2-ffi Python wheels, Swift package, C archives,
# Go module, and web package, which a release workflow ffi/release/package.py's `init` writes
# calls at a pinned rust2 commit.
# It publishes nothing and holds no credentials: the caller's own jobs publish what it
# uploads, once its consumers pass. See ffi/release/README.md.
on:
  workflow_call:
    inputs:
      manifest-path:
        description: The Cargo.toml of the package whose pub API the bindings export
        required: true
        type: string
      features:
        description: Cargo features the export and every build turn on, space-separated
        default: ''
        type: string
      example:
        description: An example of the package whose stdout every check program must print
        default: ''
        type: string
      python-check:
        description: A program run on each installed wheel from a clean directory, or a directory holding it as check.py beside the modules it imports
        default: ''
        type: string
      swift-check:
        description: The main.swift of an executable run on the installed Swift package
        default: ''
        type: string
      reproduce:
        description: Build every host's packages a second time, from a new export, and fail unless the bytes match
        default: false
        type: boolean
      c-check:
        description: A C or C++ program built by clean CMake and pkg-config consumers of each C archive, or a directory holding it as check.c or check.cpp beside the headers it includes
        default: ''
        type: string
      web-manifest-path:
        description: The Cargo.toml of the package whose wasm32-wasip1 export the npm and JSR package holds, often manifest-path; without it, no web package
        default: ''
        type: string
      scope:
        description: The npm and JSR scope the web package is named under, @<scope>/<crate>, without its @
        default: ''
        type: string
      web-check:
        description: A TypeScript module run on the installed npm package, importing the binding as ./web/<module>.ts does beside the export, or a directory holding it as check.ts beside the modules it imports
        default: ''
        type: string
      web-features:
        description: Cargo features of a web crate apart from manifest-path's, which takes features
        default: ''
        type: string
      web-example:
        description: The example of a web crate apart from manifest-path's whose stdout web-check must print, which takes example
        default: ''
        type: string
      go-module:
        description: The Go module's path; without it, the export's own, which no proxy serves
        default: ''
        type: string
      go-check:
        description: The main.go of a program, importing the module's packages, run against it
        default: ''
        type: string
      checks-artifact:
        description: An artifact of the caller's run unpacked over its checkout before the checks are read, for checks it generates
        default: ''
        type: string
    outputs:
      version:
        description: The package's Cargo version
        value: ${{ jobs.facts.outputs.version }}
      tag:
        description: The release tag the hosted XCFramework URL names, <package>-v<version>
        value: ${{ jobs.facts.outputs.tag }}
      module:
        description: The Swift module, whose XCFramework is <module>FFI.xcframework.zip
        value: ${{ jobs.facts.outputs.module }}
      web:
        description: Whether the build made the web package, <name>-web
        value: ${{ inputs.web-manifest-path != '' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MANIFEST: ${{ inputs.manifest-path }}
  FEATURES: ${{ inputs.features }}

jobs:
  facts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      name: ${{ steps.facts.outputs.name }}
      version: ${{ steps.facts.outputs.version }}
      tag: ${{ steps.facts.outputs.tag }}
      module: ${{ steps.facts.outputs.module }}
      fixture: ${{ steps.mode.outputs.fixture }}
      web-fixture: ${{ steps.mode.outputs.web-fixture }}
      rust2: ${{ steps.identity.outputs.workflow_repository }}
      rust2-sha: ${{ steps.identity.outputs.workflow_sha }}
      previous: ${{ steps.previous.outputs.previous }}
      baseline: ${{ steps.previous.outputs.baseline }}
    steps:
      # Read new job identity fields through JSON until actionlint knows their types.
      - id: identity
        env:
          JOB: ${{ toJSON(job) }}
        run: |
          for field in workflow_repository workflow_sha; do
            value=$(jq -er --arg field "$field" '.[$field] | select(type == "string" and length > 0)' <<< "$JOB")
            echo "$field=$value" >> "$GITHUB_OUTPUT"
          done
      # rust2's own test exports moq's stand-in facade, which `just ffi standin` writes from
      # moq's pinned sources: no repository holds it.
      - id: mode
        env:
          RUST2: ${{ steps.identity.outputs.workflow_repository }}
          WEB_MANIFEST: ${{ inputs.web-manifest-path }}
        run: |
          if [[ "$RUST2" == "$GITHUB_REPOSITORY" && "$MANIFEST" == ffi/target/moq-ffi/Cargo.toml ]]; then
            echo fixture=true >> "$GITHUB_OUTPUT"
          else
            echo fixture=false >> "$GITHUB_OUTPUT"
          fi
          if [[ "$RUST2" == "$GITHUB_REPOSITORY" && "$WEB_MANIFEST" == ffi/target/moq-ffi-web/Cargo.toml ]]; then
            echo web-fixture=true >> "$GITHUB_OUTPUT"
          else
            echo web-fixture=false >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.identity.outputs.workflow_repository }}
          ref: ${{ steps.identity.outputs.workflow_sha }}
          path: rust2
          persist-credentials: false
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        if: steps.mode.outputs.fixture == 'true'
        with:
          tool: just
      - name: Stand-in
        if: steps.mode.outputs.fixture == 'true'
        working-directory: source
        run: just ffi standin
      - id: facts
        working-directory: source
        run: python3 -I ../rust2/ffi/release/package.py facts --manifest-path "$MANIFEST" >> "$GITHUB_OUTPUT"
      # The APIs of the release the changelog follows and of the newest one Cargo treats as
      # compatible with this version, which the export must not break.
      - id: previous
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I ../rust2/ffi/release/package.py previous --manifest-path "$MANIFEST" --repo "$GITHUB_REPOSITORY" --out ../previous >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.previous.outputs.previous != ''
        with:
          name: ${{ steps.facts.outputs.name }}-previous
          path: previous
          if-no-files-found: error

  # Each target's API, checked on the host whose C toolchain its build scripts need, for
  # every build host's export to merge into one binding. Beside each prebuilt package's
  # targets, those the sdist builds a wheel on, package.py's SDIST_TARGETS: the generated
  # crate builds for no target it was not exported for.
  api:
    needs: facts
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux-x64
            os: ubuntu-24.04
            targets: x86_64-unknown-linux-gnu x86_64-unknown-linux-musl
          - host: linux-arm64
            os: ubuntu-24.04-arm
            targets: aarch64-unknown-linux-gnu aarch64-unknown-linux-musl
          - host: apple
            os: macos-26
            targets: aarch64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-darwin
          # MSVC's library for the wheel, MinGW's for Go, which links through MinGW.
          - host: windows
            os: windows-latest
            targets: x86_64-pc-windows-msvc x86_64-pc-windows-gnu aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      # ffi/rust-toolchain.toml links to ts/'s.
      - if: runner.os == 'Windows'
        run: git config --global core.symlinks true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.facts.outputs.rust2 }}
          ref: ${{ needs.facts.outputs.rust2-sha }}
          path: rust2
          persist-credentials: false
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        if: needs.facts.outputs.fixture == 'true'
        with:
          tool: just
      - name: Stand-in
        if: needs.facts.outputs.fixture == 'true'
        working-directory: source
        run: just ffi standin
      # musl-gcc, which a build script's cc compiles musl's C with.
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -yq musl-tools
      - name: Exporter
        working-directory: rust2/ffi
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          read -ra targets <<< "$TARGETS"
          rustup target add "${targets[@]}"
          cargo build --locked --release
      - name: Stage
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          read -ra targets <<< "$TARGETS"
          python3 -I rust2/ffi/release/package.py api --manifest-path "source/$MANIFEST" --features "$FEATURES" --out api "${targets[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.facts.outputs.name }}-api-${{ matrix.host }}
          path: api
          if-no-files-found: error

  # Each host exports the binding with every target's API, builds its own targets, and runs
  # the native example the consumers compare with.
  build:
    needs: [facts, api]
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux-x64
            os: ubuntu-24.04
            targets: x86_64-unknown-linux-gnu
          - host: linux-arm64
            os: ubuntu-24.04-arm
            targets: aarch64-unknown-linux-gnu
          # One leg per Apple slice: a 3-core runner takes about 20 minutes for each of moq's.
          - host: apple-darwin
            os: macos-26
            targets: aarch64-apple-darwin
          - host: apple-ios
            os: macos-26
            targets: aarch64-apple-ios
          - host: apple-ios-sim
            os: macos-26
            targets: aarch64-apple-ios-sim
          # Intel macOS's Go library, which the export's Go links once its API is merged, and
          # its native output; named apart from apple-*, the Swift package's slices.
          - host: darwin-x64
            os: macos-15-intel
            targets: x86_64-apple-darwin
          - host: windows
            os: windows-latest
            targets: x86_64-pc-windows-msvc x86_64-pc-windows-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - if: runner.os == 'Windows'
        run: git config --global core.symlinks true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.facts.outputs.rust2 }}
          ref: ${{ needs.facts.outputs.rust2-sha }}
          path: rust2
          persist-credentials: false
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        if: needs.facts.outputs.fixture == 'true'
        with:
          tool: just
      - name: Stand-in
        if: needs.facts.outputs.fixture == 'true'
        working-directory: source
        run: just ffi standin
      # The tools that build and repair, apart from the CPython the consumers test on.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Packaging tools
        run: |
          case "$RUNNER_OS" in
            Linux) python -m pip install auditwheel==6.8.2 patchelf==0.17.2.4 cargo-zigbuild==0.24.1 ziglang==0.17.1 ;;
            macOS) python -m pip install delocate==0.13.0 ;;
            Windows) python -m pip install delvewheel==1.13.2 ;;
          esac
      - name: Exporter
        working-directory: rust2/ffi
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          read -ra targets <<< "$TARGETS"
          rustup target add "${targets[@]}"
          cargo build --locked --release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ needs.facts.outputs.name }}-api-*
          path: api
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.facts.outputs.baseline != ''
        with:
          name: ${{ needs.facts.outputs.name }}-previous
          path: previous
      # A version must not break the API of the newest release Cargo treats as compatible.
      - name: Export
        env:
          TARGETS: ${{ matrix.targets }}
          BASELINE: ${{ needs.facts.outputs.baseline }}
          GO_MODULE: ${{ inputs.go-module }}
        run: |
          read -ra targets <<< "$TARGETS"
          baseline=()
          if [[ -n "$BASELINE" ]]; then baseline=(--baseline previous/baseline/api.json); fi
          python3 -I rust2/ffi/release/package.py export --manifest-path "source/$MANIFEST" --features "$FEATURES" --api api "${baseline[@]}" --go-module "$GO_MODULE" --out export "${targets[@]}"
      - name: Build
        env:
          TARGETS: ${{ matrix.targets }}
          EXAMPLE: ${{ inputs.example }}
        run: |
          read -ra targets <<< "$TARGETS"
          python -I rust2/ffi/release/package.py build --manifest-path "source/$MANIFEST" --features "$FEATURES" --export export --out dist --example "$EXAMPLE" "${targets[@]}"
      # One host's: the sources are the same on every host, as `agree` checks their binding.
      - name: Source distribution
        if: matrix.host == 'linux-x64'
        run: python3 -I rust2/ffi/release/package.py sdist --manifest-path "source/$MANIFEST" --export export --out dist
      # The build again, as a rerun makes it: the same packages byte for byte, from a new
      # export at the same path, since dlltool names the Windows GNU library's import symbols
      # after the target directory. It doubles the job's time.
      - name: Rebuild
        if: inputs.reproduce
        env:
          TARGETS: ${{ matrix.targets }}
          GO_MODULE: ${{ inputs.go-module }}
          HOST: ${{ matrix.host }}
        run: |
          read -ra targets <<< "$TARGETS"
          mv export first-export
          python3 -I rust2/ffi/release/package.py export --manifest-path "source/$MANIFEST" --features "$FEATURES" --api api --go-module "$GO_MODULE" --out export "${targets[@]}"
          python -I rust2/ffi/release/package.py build --manifest-path "source/$MANIFEST" --features "$FEATURES" --export export --out again/dist "${targets[@]}"
          if [[ "$HOST" == linux-x64 ]]; then
            python3 -I rust2/ffi/release/package.py sdist --manifest-path "source/$MANIFEST" --export export --out again/dist
          fi
          python3 -I rust2/ffi/release/package.py same dist again/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.checks-artifact != ''
        with:
          name: ${{ inputs.checks-artifact }}
          path: source
      # A Python or C check lands as a directory holding it as check.<ext>, whichever form the
      # input takes: a file is copied into one, and a directory whole.
      - name: Checks
        env:
          PYTHON_CHECK: ${{ inputs.python-check }}
          SWIFT_CHECK: ${{ inputs.swift-check }}
          C_CHECK: ${{ inputs.c-check }}
          GO_CHECK: ${{ inputs.go-check }}
        run: |
          mkdir -p dist/checks
          stage() {
            if [[ -d "source/$1" ]]; then cp -R "source/$1" "$2"; else mkdir "$2" && cp "source/$1" "$2/$3"; fi
          }
          if [[ -n "$PYTHON_CHECK" ]]; then stage "$PYTHON_CHECK" dist/checks/python check.py; fi
          if [[ -n "$SWIFT_CHECK" ]]; then cp "source/$SWIFT_CHECK" dist/checks/main.swift; fi
          # A file's extension says whether it is C or C++.
          if [[ -n "$C_CHECK" ]]; then stage "$C_CHECK" dist/checks/c "check.${C_CHECK##*.}"; fi
          if [[ -n "$GO_CHECK" ]]; then cp "source/$GO_CHECK" dist/checks/main.go; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.facts.outputs.name }}-build-${{ matrix.host }}
          path: dist
          if-no-files-found: error

  # The hosts' exports must be one binding: a module and a library from different builds
  # refuse to load, but two wheels of different bindings would each load. Their SBOMs, of
  # the one dependency graph, must match as well.
  agree:
    needs: [facts, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ needs.facts.outputs.name }}-build-*
          path: builds
      - run: |
          sort -u builds/*/digest.txt > digests
          cat builds/*/digest.txt
          if [[ $(wc -l < digests) != 1 ]]; then
            echo '::error::The build hosts exported different bindings.'
            exit 1
          fi
          if [[ $(sha256sum builds/*/sbom.cdx.json | cut -d' ' -f1 | sort -u | wc -l) != 1 ]]; then
            echo '::error::The build hosts listed different dependencies.'
            exit 1
          fi

  # The release's API, which the next release is checked against, and its changelog from
  # the previous release's: what the caller's release publishes beside the packages.
  changes:
    needs: [facts, agree]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.facts.outputs.rust2 }}
          ref: ${{ needs.facts.outputs.rust2-sha }}
          path: rust2
          sparse-checkout: ffi/release
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.facts.outputs.name }}-build-linux-x64
          path: build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.facts.outputs.previous != ''
        with:
          name: ${{ needs.facts.outputs.name }}-previous
          path: previous
      - env:
          PREVIOUS: ${{ needs.facts.outputs.previous }}
        run: |
          mkdir release
          cp build/export/api.json release/api.json
          old=()
          if [[ -n "$PREVIOUS" ]]; then old=(--old previous/previous/api.json --since "$PREVIOUS"); fi
          python3 -I rust2/ffi/release/package.py changes "${old[@]}" --new release/api.json > release/changes.md
          cat release/changes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.facts.outputs.name }}-release
          path: release
          if-no-files-found: error

  swift:
    needs: [facts, build]
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.facts.outputs.rust2 }}
          ref: ${{ needs.facts.outputs.rust2-sha }}
          path: rust2
          persist-credentials: false
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        if: needs.facts.outputs.fixture == 'true'
        with:
          tool: just
      - name: Stand-in
        if: needs.facts.outputs.fixture == 'true'
        working-directory: source
        run: just ffi standin
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ needs.facts.outputs.name }}-build-apple-*
          path: apple
          merge-multiple: true
      - name: Package
        env:
          URL: https://github.com/${{ github.repository }}/releases/download/${{ needs.facts.outputs.tag }}/${{ needs.facts.outputs.module }}FFI.xcframework.zip
        run: |
          args=()
          for target in aarch64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim; do
            args+=(--lib "$target=$(echo "$PWD"/apple/static/"$target"/*.a)" --native "$target=$PWD/apple/static/$target/native.txt")
          done
          cd source
          python3 -I ../rust2/ffi/release/package.py swift --manifest-path "$MANIFEST" --export ../apple/export "${args[@]}" --url "$URL" --out ../swift
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.facts.outputs.name }}-swift
          path: swift
          if-no-files-found: error

  # A fresh environment per wheel, on the oldest CPython its stable ABI claims, with no
  # checkout, Rust, or source path: what a user's `pip install` gets.
  python:
    needs: [facts, build, agree]
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux-x64
            os: ubuntu-24.04
          - host: linux-arm64
            os: ubuntu-24.04-arm
          - host: apple-darwin
            os: macos-26
          - host: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.facts.outputs.rust2 }}
          ref: ${{ needs.facts.outputs.rust2-sha }}
          path: rust2
          sparse-checkout: ffi/release
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.facts.outputs.name }}-build-${{ matrix.host }}
          path: dist
      - name: Python floor
        id: floor
        run: |
          shopt -s nullglob
          wheels=(dist/wheels/*.whl)
          [[ ${#wheels[@]} == 1 ]] || { echo "::error::expected one wheel, found ${wheels[*]}"; exit 1; }
          tag=$(basename "${wheels[0]}" .whl | cut -d- -f3)
          [[ "$tag" =~ ^cp3([0-9]+)$ ]] || { echo "::error::no CPython floor in ${wheels[0]}"; exit 1; }
          echo "version=3.${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.floor.outputs.version }}
      - name: Install and run
        run: |
          python -m venv "$RUNNER_TEMP/env"
          if [[ "$RUNNER_OS" == Windows ]]; then py="$RUNNER_TEMP/env/Scripts/python.exe"; else py="$RUNNER_TEMP/env/bin/python"; fi
          "$py" -m pip install --no-index --no-deps dist/wheels/*.whl
          args=()
          if [[ -f dist/native.txt ]]; then args+=(--native dist/native.txt); fi
          if [[ -d dist/checks/python ]]; then
            "$py" -I rust2/ffi/release/package.py consume-python --check dist/checks/python "${args[@]}"
          else
            "$py" -I rust2/ffi/release/package.py consume-python --import "$(cat dist/lib.txt)"
          fi
          echo "PY=$py" >> "$GITHUB_ENV"
      # The installed package as a caller's type checker finds it: through its py.typed, and
      # with no error under --strict. One host's, as the module is the same on each.
      - name: Type check
        if: matrix.host == 'linux-x64'
        run: |
          python -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/python" -m pip install -q mypy==2.4.1
          mkdir "$RUNNER_TEMP/typed"
          cd "$RUNNER_TEMP/typed"
          "$RUNNER_TEMP/tools/bin/mypy" --strict --python-executable "$PY" -p "$(cat "$GITHUB_WORKSPACE/dist/lib.txt")"

  # The sdist built and installed by pip, with Rust's toolchain and no other, on targets no
  # prebuilt wheel covers: musllinux in Alpine, Windows on arm64, and Intel macOS. Each runs
  # the check against its OS's native output.
  python-sdist:
    needs: [facts, build, agree]
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: musllinux-x64
            os: ubuntu-24.04
            native: linux-x64
          - host: windows-arm64
            os: windows-11-arm
            native: windows
          - host: darwin-x64
            os: macos-15-intel
            native: darwin-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.facts.outputs.rust2 }}
          ref: ${{ needs.facts.outputs.rust2-sha }}
          path: rust2
          sparse-checkout: ffi/release
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.facts.outputs.name }}-build-linux-x64
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.facts.outputs.name }}-build-${{ matrix.native }}
          path: native
      - name: Python floor
        id: floor
        run: |
          shopt -s nullglob
          wheels=(dist/wheels/*.whl)
          [[ ${#wheels[@]} == 1 ]] || { echo "::error::expected one wheel, found ${wheels[*]}"; exit 1; }
          tag=$(basename "${wheels[0]}" .whl | cut -d- -f3)
          [[ "$tag" =~ ^cp3([0-9]+)$ ]] || { echo "::error::no CPython floor in ${wheels[0]}"; exit 1; }
          echo "version=3.${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          args=(--check dist/checks/python)
          if [[ ! -d dist/checks/python ]]; then args=(--import "$(cat dist/lib.txt)"); fi
          if [[ -f native/native.txt ]]; then args+=(--native native/native.txt); fi
          echo "args=${args[*]}" >> "$GITHUB_OUTPUT"
      # Alpine's own Python and rustup's Rust, whose host is the musl target the export names.
      - name: Install and run in Alpine
        if: matrix.host == 'musllinux-x64'
        env:
          ARGS: ${{ steps.floor.outputs.args }}
          FLOOR: ${{ steps.floor.outputs.version }}
        run: |
          docker run --rm -v "$PWD:/work" -w /work -e ARGS "python:$FLOOR-alpine" sh -euc '
            apk add --no-cache build-base rustup
            rustup-init -y --profile minimal --default-toolchain stable
            export PATH="$HOME/.cargo/bin:$PATH"
            python -m venv /env
            /env/bin/python -m pip install -v --no-index --no-deps dist/sdist/*.tar.gz
            /env/bin/python -I rust2/ffi/release/package.py consume-python $ARGS
          '
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: matrix.host != 'musllinux-x64'
        with:
          python-version: ${{ steps.floor.outputs.version }}
      - name: Install and run
        if: matrix.host != 'musllinux-x64'
        env:
          ARGS: ${{ steps.floor.outputs.args }}
        run: |
          if ! command -v rustup > /dev/null; then
            if [[ "$RUNNER_OS" == Windows ]]; then
              curl -sSfLo "$RUNNER_TEMP/rustup-init.exe" https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe
              "$RUNNER_TEMP/rustup-init.exe" -y --profile minimal --default-toolchain stable
            else
              curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
            fi
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          python -m venv "$RUNNER_TEMP/env"
          if [[ "$RUNNER_OS" == Windows ]]; then py="$RUNNER_TEMP/env/Scripts/python.exe"; else py="$RUNNER_TEMP/env/bin/python"; fi
          "$py" -m pip install -v --no-index --no-deps dist/sdist/*.tar.gz
          read -ra args <<< "$ARGS"
          "$py" -I rust2/ffi/release/package.py consume-python "${args[@]}"

  # A new SwiftPM package whose only library is the staged package, as a user's would be,
  # run on macOS and built for iOS devices and simulators.
  swift-consumer:
    needs: [facts, swift, agree]
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.facts.outputs.rust2 }}
          ref: ${{ needs.facts.outputs.rust2-sha }}
          path: rust2
          sparse-checkout: ffi/release
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.facts.outputs.name }}-swift
          path: swift
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.facts.outputs.name }}-build-apple-darwin
          path: apple
      - name: Consume
        env:
          MODULE: ${{ needs.facts.outputs.module }}
        run: bash rust2/ffi/release/consume-swift.sh swift apple

  # Each C archive unpacked alone, with no checkout, Rust, or source path: a new CMake project
  # finding it by its CPS file and by its config package, and on Linux and macOS a pkg-config
  # build, each linking the static and the shared library.
  c:
    needs: [facts, build, agree]
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux-x64
            os: ubuntu-24.04
          - host: linux-arm64
            os: ubuntu-24.04-arm
          - host: apple-darwin
            os: macos-26
          - host: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.facts.outputs.rust2 }}
          ref: ${{ needs.facts.outputs.rust2-sha }}
          path: rust2
          sparse-checkout: ffi/release
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.facts.outputs.name }}-build-${{ matrix.host }}
          path: dist
      # The oldest CMake that reads CPS is 4.3; the config package serves older ones too.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Consume
        run: |
          python -m pip install cmake==4.4.5
          if [[ "$RUNNER_OS" == macOS ]] && ! command -v pkg-config > /dev/null; then brew install pkgconf; fi
          shopt -s nullglob
          archives=(dist/c/*)
          [[ ${#archives[@]} == 1 ]] || { echo "::error::expected one C archive, found ${archives[*]}"; exit 1; }
          args=(--archive "${archives[0]}")
          if [[ -f dist/native.txt ]]; then args+=(--native dist/native.txt); fi
          if [[ -d dist/checks/c ]]; then args+=(--check dist/checks/c); fi
          python -I rust2/ffi/release/package.py consume-c "${args[@]}"

  # The web binding's npm and JSR packages: web-manifest-path exported for wasm32-wasip1
  # alone, the binding's only target, and its module built beside it; with native Rust's
  # output on that target, which the consumers compare with.
  web:
    needs: facts
    if: inputs.web-manifest-path != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.facts.outputs.rust2 }}
          ref: ${{ needs.facts.outputs.rust2-sha }}
          path: rust2
          persist-credentials: false
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        if: needs.facts.outputs.web-fixture == 'true'
        with:
          tool: just
      - name: Stand-in
        if: needs.facts.outputs.web-fixture == 'true'
        working-directory: source
        run: just ffi standin "" web
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.checks-artifact != ''
        with:
          name: ${{ inputs.checks-artifact }}
          path: source
      # npm packs, and Node's WASI runs the native example.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Exporter
        working-directory: rust2/ffi
        run: cargo build --locked --release
      # The crate's own features and example, or a web crate's apart from it.
      - name: Package
        env:
          WEB_MANIFEST: ${{ inputs.web-manifest-path }}
          SCOPE: ${{ inputs.scope }}
          VERSION: ${{ needs.facts.outputs.version }}
          EXAMPLE: ${{ inputs.example }}
          WEB_FEATURES: ${{ inputs.web-features }}
          WEB_EXAMPLE: ${{ inputs.web-example }}
          WEB_CHECK: ${{ inputs.web-check }}
          REPRODUCE: ${{ inputs.reproduce }}
        run: |
          if [[ "$(realpath -m "source/$WEB_MANIFEST")" == "$(realpath -m "source/$MANIFEST")" ]]; then
            if [[ -n "$WEB_FEATURES$WEB_EXAMPLE" ]]; then
              echo "::error::web-features and web-example are for a web crate apart from manifest-path's: set features and example"
              exit 1
            fi
            features=$FEATURES example=$EXAMPLE
          else
            features=$WEB_FEATURES example=$WEB_EXAMPLE
          fi
          python3 -I rust2/ffi/release/package.py web --manifest-path "source/$WEB_MANIFEST" --features "$features" --scope "$SCOPE" --version "$VERSION" --example "$example" --out web
          # A directory whole, or a file copied into one as check.ts.
          if [[ -n "$WEB_CHECK" && -d "source/$WEB_CHECK" ]]; then
            cp -R "source/$WEB_CHECK" web/check
          elif [[ -n "$WEB_CHECK" ]]; then
            mkdir web/check && cp "source/$WEB_CHECK" web/check/check.ts
          fi
          # The build again, from a new export, which must pack the same tarball.
          if [[ "$REPRODUCE" == true ]]; then
            python3 -I rust2/ffi/release/package.py web --manifest-path "source/$WEB_MANIFEST" --features "$features" --scope "$SCOPE" --version "$VERSION" --example "" --out web-again
            python3 -I rust2/ffi/release/package.py same web web-again
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.facts.outputs.name }}-web
          path: web
          if-no-files-found: error

  # A new npm project depending on only the packed tarball, as an app's would, run on
  # Node, Deno, and Bun and bundled by Vite and webpack; and JSR's checks of its package.
  web-consumer:
    needs: [facts, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.facts.outputs.rust2 }}
          ref: ${{ needs.facts.outputs.rust2-sha }}
          path: rust2
          sparse-checkout: ffi/release
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.facts.outputs.name }}-web
          path: web
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install and run
        run: |
          args=()
          if [[ -d web/check ]]; then args+=(--check web/check); fi
          if [[ -f web/native.txt ]]; then args+=(--native web/native.txt); fi
          python3 -I rust2/ffi/release/package.py consume-web --dist web "${args[@]}"

  # The module as a GOPROXY serves it: the export's packages, and each Go target's library
  # beside the runtime that links it.
  go:
    needs: [facts, build, agree]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.facts.outputs.rust2 }}
          ref: ${{ needs.facts.outputs.rust2-sha }}
          path: rust2
          persist-credentials: false
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        if: needs.facts.outputs.fixture == 'true'
        with:
          tool: just
      - name: Stand-in
        if: needs.facts.outputs.fixture == 'true'
        working-directory: source
        run: just ffi standin
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ needs.facts.outputs.name }}-build-*
          path: builds
      # The go command reads the module's go.mod.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache: false
      - name: Module
        env:
          NAME: ${{ needs.facts.outputs.name }}
        run: |
          mkdir libs
          cp builds/*/go/*.a libs/
          cd source
          python3 -I ../rust2/ffi/release/package.py go --manifest-path "$MANIFEST" --export "../builds/$NAME-build-linux-x64/export" --libs ../libs --out ../proxy >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.facts.outputs.name }}-go
          path: proxy
          if-no-files-found: error

  # A new module whose only requirement is the built one, unpacked from its zip, as `go get`
  # unpacks it: built and run on each platform with no checkout, Rust, or CGO_LDFLAGS.
  go-consumer:
    needs: [facts, go]
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux-x64
            os: ubuntu-24.04
          - host: linux-arm64
            os: ubuntu-24.04-arm
          - host: apple-darwin
            os: macos-26
          - host: darwin-x64
            os: macos-15-intel
          - host: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.facts.outputs.rust2 }}
          ref: ${{ needs.facts.outputs.rust2-sha }}
          path: rust2
          sparse-checkout: ffi/release
          persist-credentials: false
      # The newest Go, whose cgo checks what a #cgo line links most strictly.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.facts.outputs.name }}-go
          path: proxy
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.facts.outputs.name }}-build-${{ matrix.host }}
          path: dist
      - name: Build and run
        run: |
          args=()
          if [[ -f dist/checks/main.go ]]; then args+=(--check dist/checks/main.go); fi
          if [[ -f dist/native.txt ]]; then args+=(--native dist/native.txt); fi
          python3 -I rust2/ffi/release/package.py consume-go --proxy proxy "${args[@]}"
