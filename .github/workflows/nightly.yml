name: Nightly

# The gates too slow for a pull request. A failure lands on main rather than in
# review, which is the accepted trade; anything that must block a merge belongs
# in `just ci`.

permissions:
  contents: read

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ffi-sanitize:
    name: Export to C under sanitizers and Miri
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      - name: Host
        run: |
          uname -a; cat /proc/sys/vm/mmap_rnd_bits /proc/sys/vm/mmap_rnd_compat_bits || true
          sudo sysctl vm.mmap_rnd_bits vm.mmap_rnd_compat_bits; getconf PAGESIZE;  cat /proc/cpuinfo | grep -m1 -i 'model name\|cpu part'

      - name: Sanitize
        run: nix develop .#sanitize --command bash -c 'cd ffi && export PATH=$RUST2_TS_TOOLCHAIN/bin:$PATH && for t in api_asan api_tsan api_swift_tsan; do cargo test --locked --test fixtures -- --ignored --exact $t 2>&1 | tail -40 || true; done'


      - name: Debug
        if: always()
        run: |
          nix develop .#sanitize --command bash -c '
            export PATH=$RUST2_TS_TOOLCHAIN/bin:$PATH
            rustc -vV
            cd ffi/target/tmp/api
            for d in address thread; do
              echo "== $d"
              ASAN_OPTIONS=verbosity=1 TSAN_OPTIONS=verbosity=1 $d/api-c 2>&1 | head -40
              echo "exit ${PIPESTATUS[0]}"
              lldb -b -o run -o "thread backtrace" -- $d/api-c 2>&1 | grep -E "^ *frame" | head -20
            done
            mkdir -p /tmp/h; cd /tmp/h
            printf "fn main(){println!(\"hi\");}" > h.rs
            printf "int main(){return 0;}" > h.c
            clang -fsanitize=address -c h.c -o h.o
            clang -fsanitize=address h.c -o hc && ASAN_OPTIONS=verbosity=1 ./hc 2>&1 | head -20
            for s in address thread; do
              rustc -Zsanitizer=$s h.rs -o hr-$s --target aarch64-unknown-linux-gnu && ./hr-$s; echo "rust hello $s exit $?"
              rustc -Zsanitizer=$s h.rs --emit=llvm-ir -o hr-$s.ll --target aarch64-unknown-linux-gnu; grep -m5 -E "shadow|inttoptr|add i64" hr-$s.ll
              clang -fsanitize=$s -### h.c 2>&1 | tr " " "\n" | grep -i -E "asan|tsan|rtlib|clang_rt|shared" | head
            done
            ls /nix/store | grep -E "compiler-rt|clang-" | head -20
          '

  # The C++ header with the compilers the job above lacks, through the same checks, the
  # Python on the platforms the job above lacks, and on macOS the Swift with Apple's
  # toolchain.
