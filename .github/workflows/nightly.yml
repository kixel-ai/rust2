name: Nightly

# The gates too slow for a pull request. A failure lands on main rather than in
# review, which is the accepted trade; anything that must block a merge belongs
# in `just ci`.

permissions:
  contents: read

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ffi-sanitize:
    name: Export to C under sanitizers and Miri
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      - name: Host
        run: |
          uname -a; cat /proc/sys/vm/mmap_rnd_bits /proc/sys/vm/mmap_rnd_compat_bits || true
          sudo sysctl vm.mmap_rnd_bits vm.mmap_rnd_compat_bits; getconf PAGESIZE;  cat /proc/cpuinfo | grep -m1 -i 'model name\|cpu part'

      - name: Sanitize
        run: nix develop .#sanitize --command bash -c 'cd ffi && export PATH=$RUST2_TS_TOOLCHAIN/bin:$PATH && for t in api_asan api_tsan api_swift_tsan; do cargo test --locked --test fixtures -- --ignored --exact $t 2>&1 | tail -40 || true; done'


      - name: Debug
        if: always()
        run: |
          nix develop .#sanitize --command bash -c '
            cd ffi/target/tmp/api/address
            readelf -SW api-c | grep -E "init_array|preinit|fini_array|\.tdata|\.tbss|\.got"
            readelf -rW api-c | grep -c .
            readelf -x .init_array api-c; readelf -x .preinit_array api-c
            nm -n api-c | grep -E " (asan.module_ctor|__asan_init|_GLOBAL__sub_I|__asan_version)|module_ctor" | head -20
            lldb -b -o "b __asan_init" -o "b __asan_version_mismatch_check_v8" -o run -o "bt" -o "register read lr pc sp" -o c -o bt -- api-c 2>&1 | grep -v "^ *$" | head -60
            echo ==== lldb2
            lldb -b -o run -o "register read" -o "x/6i \$pc-8" -o "image lookup -a \$lr" -o "memory read --size 8 --count 12 \$sp" -- api-c 2>&1 | tail -50
          '

  # The C++ header with the compilers the job above lacks, through the same checks, the
  # Python on the platforms the job above lacks, and on macOS the Swift with Apple's
  # toolchain.
