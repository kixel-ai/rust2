name: Queue

# GitHub's merge queue tests each picked PR on top of main, one at a time, on
# the host's self-hosted runner, and merges exactly the tree it tested. When the
# queue drops a PR, moq-dev/quest's queue watcher on the host runs the land
# fixer and re-enqueues it at the back of the queue.
#
# `main`'s ruleset requires the build's own `Queue build / Build` context, so
# a group's check reports from the self-hosted runner and waits on no
# GitHub-hosted one. GitHub admits a PR to the queue only once its required
# checks pass on the PR itself, so the build is also called on main pull
# requests, where its job skips under the same name; a skipped job satisfies
# the requirement. Only the merge group build runs code, and only a
# maintainer's pick enters the queue.
on:
  pull_request:
    branches: [main]
    # `edited` covers a PR retargeted to main, which needs the context too.
    types: [opened, synchronize, reopened, edited]
  merge_group:
    types: [checks_requested]
  # Reports the skipped context on a PR's head without a pull_request event.
  # A PR whose test merge commit predates this workflow gets no pull_request
  # run from it (GitHub runs PR workflows from that commit, and a dispatch reads
  # the workflow from the ref it runs on), so
  # `gh workflow run queue.yml -f sha=<head>` on main reports it there.
  workflow_dispatch:
    inputs:
      sha:
        description: The PR head commit to report the skipped Queue build / Build context on.
        required: true

permissions:
  contents: read

# No concurrency group. Cancelling a pull request's run, as a second event for
# the PR would, can report the build cancelled and fail the requirement; even a
# group without cancel-in-progress cancels a pending run. Each merge group has
# its own ref, so its run never had another to replace, and a repeated dispatch
# only reports the same skipped context twice.

jobs:
  # The build runs in queue-build.yml so its runner group can admit that
  # workflow alone; see that file. It calls main's copy, not the merge group's,
  # since the group admits that workflow only at refs/heads/main: a PR's edit to
  # queue-build.yml runs only after it lands.
  #
  # The call has no `if`: a skipped call reports only `Queue build`, while a
  # call whose job skips reports `Queue build / Build`, the context the
  # ruleset requires. main's copy skips that job on every event but
  # merge_group, so a pull request gets no runner. A failed or cancelled build
  # reports its own context failed or cancelled, which fails the group.
  build:
    name: Queue build
    uses: moq-dev/rust2/.github/workflows/queue-build.yml@main

  # The merge queue still builds every group with the jobs above; this only
  # satisfies the PR-side requirement, as a pull_request run's skipped job does.
  report:
    name: Report Queue
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: write
    steps:
      - name: Report the skipped Queue build / Build context
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ inputs.sha }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be a full commit SHA" >&2; exit 1; }
          gh api "repos/$REPO/check-runs" -f 'name=Queue build / Build' -f head_sha="$SHA" -f status=completed -f conclusion=skipped \
            -f 'output[title]=Queue build / Build' -f 'output[summary]=Skipped on the pull request; the merge queue builds the group.' --silent
