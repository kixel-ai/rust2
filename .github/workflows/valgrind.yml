name: Valgrind

# The binding benchmark's instruction counts (bench/ffi/README.md), each case counted under
# stock Valgrind by swole (the flake's input) into Kixel Quest's metrics.json. Nightly on main, and on
# Kixel Quest's bisect, which dispatches it on each commit it measures with the benchmarks it
# narrows down. Informational: nothing fails on a number, and no pull request runs it.

permissions:
  contents: read

on:
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:
    inputs:
      benchmarks:
        description: The benchmarks to count, one a line, as metrics.json names them; every one when empty.
        type: string
        default: ""

jobs:
  count:
    name: Count
    # Hosted, which costs a public repository nothing.
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      # The input goes through the environment, never into the script's text.
      - name: Count
        env:
          BENCHMARKS: ${{ inputs.benchmarks }}
        run: |
          args=(run --out "$PWD/kixel-metrics/metrics.json")
          # A bisect step names several suspects, some of which a commit may predate or have
          # renamed: it counts the ones there, and Kixel Quest reads the rest as unmeasured.
          if [ -n "${BENCHMARKS:-}" ]; then
            printf '%s\n' "$BENCHMARKS" > "$RUNNER_TEMP/benchmarks"
            args+=(--benchmarks "$RUNNER_TEMP/benchmarks" --allow-missing)
          fi
          nix develop .#bench --command just ffi count "${args[@]}"

      # Kixel Quest reads it once the run attempt finishes; a rerun overwrites it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kixel-metrics
          path: kixel-metrics/metrics.json
          overwrite: true
          retention-days: 30
