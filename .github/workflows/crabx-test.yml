name: Crabx fixture

on:
  pull_request:
    paths:
      - .github/crabx/**
      - .github/workflows/crabx*.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture:
    permissions:
      contents: read
      id-token: write
      attestations: write
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/crabx.yml
  pr:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/crabx.yml
