name: Release

# Publishes crabx when main carries a version crates.io lacks: crates.io first, then the
# crabx pipeline attaches attested binaries to its release, then npm. Every step skips
# what is already published, so the next push, schedule, or dispatch finishes what a
# failed run left. Tags made with GITHUB_TOKEN start no workflow, hence no tag trigger.
on:
  push:
    branches: [main]
  schedule:
    - cron: '41 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      builds: ${{ steps.plan.outputs.builds }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        run: python3 crabx/release.py crate

  # The pipeline's build of this commit on every target, so crates.io never holds a
  # version whose binaries fail to build: a published version can't be rebuilt.
  check:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    uses: ./.github/workflows/crabx-build.yml
    with:
      builds: ${{ needs.plan.outputs.builds }}
      # The binaries job uploads the same artifact names in this run.
      upload: false

  # Packaging runs build scripts, so it runs here, without the publishing job's OIDC
  # credentials, which every step of that job can request.
  package:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo package --locked
        working-directory: crabx

  crate:
    needs: [plan, check, package]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    # crates.io trusts this workflow only in this environment, which only main may deploy to.
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # --no-verify builds nothing, so no build script runs beside the token.
      - id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --no-verify
        working-directory: crabx

  # Also runs when no version was new, to backfill archives a failed run left.
  binaries:
    needs: crate
    if: ${{ !cancelled() && !failure() }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: kixel-ai/rust2/.github/workflows/crabx.yml@pipeline-v1.0.0

  # A skipped ancestor, such as crate on a retry, skips every job after it unless its own
  # condition checks a status; these check their direct dependency instead.
  npm-plan:
    needs: binaries
    if: ${{ !cancelled() && needs.binaries.result == 'success' }}
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        run: python3 crabx/release.py npm-plan

  # The one job with npm publishing rights, pinned by crabx/test_release.py. npm trusts
  # this workflow only in the npm environment, which only main may deploy to, and its
  # trusted publishing needs a GitHub-hosted runner.
  npm:
    needs: npm-plan
    if: ${{ !cancelled() && needs.npm-plan.result == 'success' && needs.npm-plan.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      attestations: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Trusted publishing needs npm 11.5.1 or later.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.npm-plan.outputs.version }}
        run: python3 crabx/release.py publish "$VERSION"
