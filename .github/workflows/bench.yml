name: Bench

permissions:
  contents: read

# Dispatched by hand, on any branch, so a lever can be measured before it
# lands; it holds no secret and only a read-only token.
on:
  workflow_dispatch:

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: Bench (${{ matrix.name }})
    # Hosted, which costs a public repository nothing. A shared VM's wall time
    # is noisy and it exposes no performance counters, so instructions read
    # n/a; each job's control variant measures the noise floor.
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      # Each job holds a base, its levers, and its control, so every comparison stays on one machine.
      matrix:
        include:
          - name: moq stable
            args: --corpus moq --variant baseline --variant mold --variant wild --variant control --no-attribute
          # jobs-frontend is left out: its 32 threads oversubscribe the runner's 4
          # vCPUs, where it measured no win (bench/build/README.md).
          - name: moq nightly
            args: --corpus moq --variant nightly --variant cranelift --variant cache-proc-macros --variant mostly-unused --variant nightly-control
          - name: moq ra-jit
            args: --corpus moq --variant ra-jit-baseline --variant ra-jit --no-attribute

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      - name: Bench
        run: nix develop .#build-bench --command just bench ${{ matrix.args }} --out bench-results

      - name: Summary
        run: cat bench-results/report.md >>"$GITHUB_STEP_SUMMARY"

      - name: Upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-${{ strategy.job-index }}
          path: bench-results
          if-no-files-found: ignore

