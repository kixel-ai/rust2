# Temporary: reproduce the flutter-consumer stall after Installing on the API 24 emulator.
name: Flutter stall repro
on:
  pull_request:
    paths: [.github/workflows/flutter-stall-repro.yml, .github/repro/**, ffi/release/package.py]
permissions:
  contents: read
  actions: read
jobs:
  repro:
    strategy:
      fail-fast: false
      matrix:
        mode: [stream, legacy, push]
        n: [1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: rust2
          sparse-checkout: |
            ffi/release
            .github/repro
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: |
          mkdir out
          flutter create --platforms android --org dev.rust2 --project-name app app
          cd app && flutter build apk --debug --target-platform android-x64
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 24
          arch: x86_64
          script: rust2/.github/repro/flutter-stall.sh ${{ matrix.mode }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repro-${{ matrix.mode }}-${{ matrix.n }}
          path: out
