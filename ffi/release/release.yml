name: Release @NAME@ bindings

# Written by rust2's `ffi/release/package.py init`; yours to edit. rust2's builder, pinned
# below, exports @NAME@'s pub API, builds its Python wheels and Swift package, and checks
# them in clean consumers, all read-only. The jobs after it publish only a tag's build:
#
# - PyPI: the project @NAME@, through the trusted publisher this repository registers there
#   for this workflow and the `pypi` environment.
# - SwiftPM: @MODULE@FFI.xcframework.zip on this repository's @NAME@-v<version> release, which
#   the Package.swift pushed to @MIRROR@ names by URL and checksum, tagged <version>.
#   The mirror's token comes from a GitHub App installed on it, whose ID and key live in
#   the `swift-mirror` environment.
#
# The Go module @GO_MODULE@ is the build's @NAME@-go artifact, its .info, .mod, .zip, and list laid
# out as a GOPROXY serves them; no job here publishes it. Serve it from a module proxy that
# @GO_MODULE@'s go-import tag names: a git mirror holds no library over GitHub's 100 MiB.
#
# To release, push the tag @NAME@-v<version>, naming the crate's version. Without a tag, as
# from a nightly's workflow_call, every job up to publication runs. If publishing fails, use
# "Re-run failed jobs": it reuses this run's build, and the publishing jobs upload only what
# is missing. A rebuild's files differ, so "Re-run all jobs" stops at any already published.
on:
  push:
    tags:
      - "@NAME@-v*"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-@NAME@-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: kixel-ai/rust2/.github/workflows/bindings.yml@@RUST2@
    with:
      manifest-path: @MANIFEST@
      go-module: @GO_MODULE@
      # Optional: cargo features to ship, an example of the crate whose output every check
      # program must print, and those programs: `python-check`, `swift-check`, and `go-check`.

  tag:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - name: Tag names the crate's version
        env:
          TAG: ${{ github.ref_name }}
          WANT: ${{ needs.build.outputs.tag }}
        run: |
          if [[ "$TAG" != "$WANT" ]]; then
            echo "::error::$TAG is not the crate's version, $WANT: bump Cargo.toml before tagging."
            exit 1
          fi

  pypi:
    needs: [build, tag]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/@NAME@
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: @NAME@-build-*
          path: dist
          merge-multiple: true
      # A rerun uploads only the wheels PyPI lacks, and fails on one it hosts with other bytes.
      - name: Skip the wheels PyPI hosts
        id: missing
        env:
          PROJECT: '@NAME@'
        shell: python3 -I {0}
        run: |
          import hashlib, json, os, pathlib, sys, urllib.error, urllib.request
          url = f"https://pypi.org/simple/{os.environ['PROJECT']}/"
          request = urllib.request.Request(url, headers={"Accept": "application/vnd.pypi.simple.v1+json"})
          try:
              with urllib.request.urlopen(request) as response:
                  hosted = {f["filename"]: f["hashes"].get("sha256") for f in json.load(response)["files"]}
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              hosted = {}
          missing = 0
          for wheel in sorted(pathlib.Path("dist/wheels").glob("*.whl")):
              if wheel.name not in hosted:
                  missing += 1
              elif hosted[wheel.name] == hashlib.sha256(wheel.read_bytes()).hexdigest():
                  print(f"PyPI already hosts {wheel.name}")
                  wheel.unlink()
              else:
                  sys.exit(f"::error::PyPI hosts another {wheel.name}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"upload={'true' if missing else 'false'}", file=output)
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        if: steps.missing.outputs.upload == 'true'
        with:
          packages-dir: dist/wheels/

  # The XCFramework the mirror's Package.swift names, uploaded once: a consumer that
  # resolved its checksum must never see other bytes at that URL. The release stays a draft
  # until its asset is up, as an immutable release takes no asset once published.
  github-release:
    needs: [build, tag]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: @NAME@-swift
          path: swift
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ASSET: ${{ needs.build.outputs.module }}FFI.xcframework.zip
          # Cargo's prerelease, such as 1.0.0-rc.1, is GitHub's too.
          PRERELEASE: ${{ contains(needs.build.outputs.version, '-') }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease="$PRERELEASE" --title "$TAG" --notes ""
          fi
          if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET" --dir existing; then
            cmp "existing/$ASSET" "swift/$ASSET" || { echo "::error::$TAG already hosts another $ASSET"; exit 1; }
          else
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "swift/$ASSET"
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

  # The hosted package, resolved by URL and checksum as a user's SwiftPM resolves it,
  # before the mirror points anyone at it.
  swift-resolve:
    needs: [build, github-release]
    runs-on: macos-26
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: @NAME@-swift
          path: swift
      - name: Resolve
        env:
          MODULE: ${{ needs.build.outputs.module }}
        run: |
          mkdir -p consumer/Sources/Check
          printf 'import %s\n' "$MODULE" > consumer/Sources/Check/main.swift
          cat > consumer/Package.swift <<SWIFT
          // swift-tools-version: 6.2
          import PackageDescription
          let package = Package(
              name: "Check",
              platforms: [.macOS("13.0"), .iOS("16.0")],
              dependencies: [.package(path: "../swift/package")],
              targets: [.executableTarget(name: "Check", dependencies: [.product(name: "$MODULE", package: "package")])]
          )
          SWIFT
          cd consumer
          swift build

  swift-mirror:
    needs: [build, swift-resolve]
    runs-on: ubuntu-24.04
    environment: swift-mirror
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: @NAME@-swift
          path: swift
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: @MIRROR_OWNER@
          repositories: @MIRROR_REPO@
          permission-contents: write
      - name: Push
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          MIRROR: '@MIRROR@'
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh auth setup-git
          git clone --quiet "https://github.com/$MIRROR.git" mirror
          cd mirror
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          if git rev-parse --quiet --verify "refs/tags/$VERSION" > /dev/null; then
            # A rerun after the push: the tag must hold exactly this package.
            git checkout --quiet "$VERSION"
            diff -r --exclude=.git . ../swift/package || { echo "::error::$MIRROR's $VERSION holds another package"; exit 1; }
            exit 0
          fi
          git rm -r --quiet --ignore-unmatch .
          cp -R ../swift/package/. .
          git add --all
          # A rerun whose branch already holds this package, but no tag, commits nothing.
          git diff --cached --quiet || git commit --quiet -m "$VERSION"
          git tag "$VERSION"
          git push --quiet --atomic origin HEAD "refs/tags/$VERSION"
