[package]
name = "rust2-ffi"
description = "Export a crate's pub API as a C ABI and header"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kixel-ai/rust2"
# Distributed through the flake: it only builds on the pinned nightly.
publish = false

[package.metadata.rust-analyzer]
rustc_private = true

[workspace]
# Its own workspace, apart from the repo's: the driver builds on ts's pinned nightly,
# which rust-toolchain.toml links.
members = ["fixtures/*"]
resolver = "3"

[workspace.lints.clippy]
# Every suppression says why, so the next lint audit can judge it.
allow_attributes_without_reason = "warn"

[dependencies]
oxc = { version = "0.159.0", default-features = false, features = ["codegen", "isolated_declarations", "semantic", "transformer"] }
rust2-driver = { path = "../driver" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
wasmparser = { version = "0.263.0", default-features = false, features = ["std"] }

[dev-dependencies]
loom = "0.7.3"

[lints]
workspace = true
