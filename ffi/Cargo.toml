[package]
name = "rust2-ffi"
description = "Export a crate's pub API as a C ABI and header"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kixel-ai/rust2"
# Distributed through the flake: it only builds on the pinned nightly.
publish = false

[package.metadata.rust-analyzer]
rustc_private = true

# Mounted by `#[path]` into a copy of an export, or by more than one test, which cargo-shear
# does not follow.
[package.metadata.cargo-shear]
ignored-paths = ["tests/miri/*.rs", "tests/protocol/*.rs"]

[workspace]
# Its own workspace, apart from the repo's: the driver builds on ts's pinned nightly,
# which rust-toolchain.toml links.
members = ["fixtures/*"]
resolver = "3"

[workspace.lints.clippy]
# Every suppression says why, so the next lint audit can judge it.
allow_attributes_without_reason = "warn"

[dependencies]
oxc = { version = "0.159.0", default-features = false, features = ["codegen", "isolated_declarations", "semantic", "transformer"] }
rust2-driver = { path = "../driver" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
wasmparser = { version = "0.263.0", default-features = false, features = ["std"] }

[dev-dependencies]
loom = "0.7.3"
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
syn = { version = "3.0.10", default-features = false, features = ["clone-impls", "full", "parsing", "printing"] }

[lints]
workspace = true

# Optimize dev builds at level 1 so `rust2-ffi` exports (`oxc`, leaf proving) and `loom`
# DPOR runs are several times faster while keeping debug assertions and fast rebuilds.
[profile.dev]
opt-level = 1
