[package]
name = "api-fixture"
description = "Each construct rust2-ffi exports, driven from C by tests/api.c"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Named apart from the package: the export's prefix, which the export must follow.
[lib]
name = "api"

[features]
# Doubles each area's size in dep-fixture, which the export must build as the check did.
doubled = ["dep-fixture/doubled"]

[dependencies]
bytes = "1.11.1"
dep-fixture = { path = "../dep" }
serde = "1.0.229"
serde_json = "1.0.154"
url = "2.5.8"

[lints]
workspace = true
