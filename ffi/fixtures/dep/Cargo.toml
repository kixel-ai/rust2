[package]
name = "dep-fixture"
description = "Another crate, whose types the api fixture re-exports and names"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Explicitly an rlib, which cargo metadata calls one.
[lib]
name = "dep"
crate-type = ["rlib"]

[features]
# Doubles each area's size: the api fixture's own feature enables it.
doubled = []

[lints]
workspace = true
