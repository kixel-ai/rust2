# What the export refuses at the pinned revision, by paths from the stand-in facade that
# `just ffi standin` writes, as `just ffi census` lists it: the API a hand-written wrapper
# still has to cover.
exclude = [
    "escape",
    "moq_tokio::accept::Failure::classify",
    "moq_tokio::accept::Health::failed",
    "moq_tokio::server::Streams::tcp",
    "moq_tokio::server::Streams::unix",
    "moq_tokio::tcp::TlsAcceptor::accept",
    "mux::container::ts::Mpegts::deserialize",
    "rustls::client::Resumption::store",
    "rustls::client::danger::DangerousClientConfig::cfg",
    "tokio::tls::Serve::resolver",
    "unescape",
]
