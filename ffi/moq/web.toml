# What the export refuses at the pinned revision of the wasm32 stand-in, which `just ffi
# standin` writes into target/moq-ffi-web: moq/ffi.toml's list, less moq-tokio's items, since
# that facade leaves moq-tokio out, as no wasm32 target builds it.
exclude = [
    "bytes",
    "hang::moq_net",
    "kio",
    "mp4_atom::TrunSamples::iter",
    "mp4_atom::Tx3g::box_record",
    "mux::container::Producer<moq::mux::catalog::hang::Container, moq::hang::catalog::AudioConfig>::modify",
    "mux::container::Producer<moq::mux::catalog::hang::Container, moq::hang::catalog::BinaryConfig>::modify",
    "mux::container::Producer<moq::mux::catalog::hang::Container, moq::hang::catalog::JsonConfig>::modify",
    "mux::container::Producer<moq::mux::catalog::hang::Container, moq::hang::catalog::TextConfig>::modify",
    "mux::container::Producer<moq::mux::catalog::hang::Container, moq::hang::catalog::VideoConfig>::modify",
    "mux::container::Producer<moq::mux::catalog::hang::Container>::modify",
    "mux::container::Producer<moq::mux::container::fmp4::Wire, moq::hang::catalog::AudioConfig>::modify",
    "mux::container::Producer<moq::mux::container::fmp4::Wire, moq::hang::catalog::BinaryConfig>::modify",
    "mux::container::Producer<moq::mux::container::fmp4::Wire, moq::hang::catalog::JsonConfig>::modify",
    "mux::container::Producer<moq::mux::container::fmp4::Wire, moq::hang::catalog::TextConfig>::modify",
    "mux::container::Producer<moq::mux::container::fmp4::Wire, moq::hang::catalog::VideoConfig>::modify",
    "mux::container::Producer<moq::mux::container::fmp4::Wire>::modify",
    "mux::container::Producer<moq::mux::container::legacy::Wire, moq::hang::catalog::AudioConfig>::modify",
    "mux::container::Producer<moq::mux::container::legacy::Wire, moq::hang::catalog::BinaryConfig>::modify",
    "mux::container::Producer<moq::mux::container::legacy::Wire, moq::hang::catalog::JsonConfig>::modify",
    "mux::container::Producer<moq::mux::container::legacy::Wire, moq::hang::catalog::TextConfig>::modify",
    "mux::container::Producer<moq::mux::container::legacy::Wire, moq::hang::catalog::VideoConfig>::modify",
    "mux::container::Producer<moq::mux::container::legacy::Wire>::modify",
    "mux::container::Producer<moq::mux::container::loc::Wire, moq::hang::catalog::AudioConfig>::modify",
    "mux::container::Producer<moq::mux::container::loc::Wire, moq::hang::catalog::BinaryConfig>::modify",
    "mux::container::Producer<moq::mux::container::loc::Wire, moq::hang::catalog::JsonConfig>::modify",
    "mux::container::Producer<moq::mux::container::loc::Wire, moq::hang::catalog::TextConfig>::modify",
    "mux::container::Producer<moq::mux::container::loc::Wire, moq::hang::catalog::VideoConfig>::modify",
    "mux::container::Producer<moq::mux::container::loc::Wire>::modify",
    "mux::container::fmp4::mp4_atom",
]
