[package]
name = "crabx"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Run a Rust CLI from its author's release, without compiling"
repository = "https://github.com/kixel-ai/rust2"
license = "GPL-3.0-only"

[workspace]

[dependencies]
async-trait = "0.1.92"
binstalk-bins = "0.7.0"
binstalk-downloader = { version = "0.14.1", default-features = false, features = ["static", "rustls", "zlib-rs"] }
binstalk-git-repo-api = "0.5.53"
binstalk-types = "0.10.8"
bytes = "1.12.1"
compact_str = "0.10.0"
either = "1.19.0"
itertools = "0.15.0"
leon = "3.0.3"
leon-macros = "1.0.4"
miette = "7.6.0"
minisign-verify = "0.3.0"
once_cell = "1.21.4"
percent-encoding = "2.3.2"
sha2 = "0.11.1"
strum = "0.28.0"
thiserror = "2.0.21"
tracing = "0.1.44"
url = "2.5.8"
anyhow = "1.0.104"
binstalk = { version = "0.30.0", default-features = false, features = ["rustls", "static", "zlib-rs"] }
clap = { version = "4.6", features = ["derive"] }
directories = "6.0.0"
hex = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sigstore-verify = { version = "0.16.0", features = ["tuf"] }
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["rt", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.183"

[profile.release]
strip = true
