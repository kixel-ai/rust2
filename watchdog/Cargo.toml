[package]
name = "rust2-watchdog"
description = "Run `cargo test` and kill it when one test runs past its nextest bound, naming that test"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kixel-ai/rust2"
readme = "README.md"
keywords = ["test", "timeout", "nextest", "libtest"]
categories = ["development-tools::testing"]

[dependencies]
anyhow = "1.0.105"
humantime = "2.4.0"
libc = "0.2.191"
regex = "1.13.2"
serde_json = "1.0.154"
signal-hook = "0.4.6"
toml = { version = "1.2.3", default-features = false, features = ["parse", "serde", "std"] }

[lints]
workspace = true

# Its own workspace, apart from the repo's, on the root's stable toolchain.
[workspace]

[workspace.lints.clippy]
# Every suppression says why, so the next lint audit can judge it.
allow_attributes_without_reason = "warn"
