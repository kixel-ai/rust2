[package]
name = "encoder-fixture"
description = "web-codecs' VideoEncoder calls over web-sys, with its closures and promises, which translate to direct JS calls"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Its own workspace and lockfile, which pins wasm-bindgen to the CLI the dev shell has, as
# the bindgen fixture's does: the native side runs through that CLI's glue.
[workspace]

[lib]
# The cdylib is the native side of the differential test, built for wasm32.
crate-type = ["lib", "cdylib"]

[dependencies]
bytes = "1"
js-sys = "0.3.106"
tokio = { version = "1.54.1", default-features = false, features = ["sync", "macros"] }
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = [
    "EncodedVideoChunk",
    "EncodedVideoChunkType",
    "LatencyMode",
    "VideoDecoderConfig",
    "VideoEncoder",
    "VideoEncoderConfig",
    "VideoEncoderEncodeOptions",
    "VideoEncoderInit",
    "VideoEncoderSupport",
    "VideoFrame",
    "VideoFrameBufferInit",
    "VideoPixelFormat",
] }

# The ts workspace's differential profile, which the tests build the native side with.
[profile.differential]
inherits = "dev"
opt-level = 1

[lints.rust]
# Translation sets `rust2_ts`, which leaves out the native side's export, and every build
# sets `web_sys_unstable_apis`, which WebCodecs is behind, as web-rs's does.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(rust2_ts)", "cfg(web_sys_unstable_apis)"] }
