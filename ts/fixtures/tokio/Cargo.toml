[package]
name = "tokio-fixture"
description = "Passes values through tokio's sync channels and select!, which rust2-ts maps itself"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
# The cdylib is the native side of the differential test, built for wasm32.
crate-type = ["lib", "cdylib"]

[dependencies]
tokio = { version = "1.54.1", default-features = false, features = ["sync", "macros"] }

[lints]
workspace = true
