[package]
name = "stock-fixture"
description = "Calls into bytes, hashbrown, rand, smallvec, and tracing, which rust2-ts maps itself, hashlink, rangemap, and arrayvec"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
# The cdylib is the native side of the differential test, built for wasm32.
crate-type = ["lib", "cdylib"]

[dependencies]
arrayvec = "0.7.8"
bytes = "1.12.1"
# The native side's source of randomness on wasm32, which its tests select.
getrandom = "0.4.3"
hashbrown = "0.17.1"
hashlink = "0.12.2"
rand = "0.10.3"
rangemap = "1.8.0"
smallvec = { version = "1.16.5", features = ["union"] }
tracing = "0.1.44"

[lints]
workspace = true
