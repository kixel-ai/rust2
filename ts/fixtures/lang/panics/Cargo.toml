[package]
name = "lang-panics-fixture"
description = "A part of the language rust2-ts translates, exercised against native Rust"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
# The cdylib is the native side of the differential test, built for wasm32.
crate-type = ["lib", "cdylib"]

[features]
# Adds the cases that set a panic hook, which has the translation give every panic its
# location: the other shape of its output. `bytes`' and tokio's panics are among them.
hook = ["dep:bytes", "dep:tokio"]

[dependencies]
bytes = { version = "1.12.1", optional = true }
edition2018 = { path = "edition2018" }
tokio = { version = "1.54.1", default-features = false, features = ["sync"], optional = true }

[lints]
workspace = true
